# Use include to modularize Compose files
# https://docs.docker.com/reference/compose-file/include/
#
# Run with
# PANGOLIN_ENDPOINT= NEWT_ID= NEWT_SECRET= docker compose --file docker-compose.yml --project-name openstudiolandscapes-hub up --remove-orphans --detach
# With --pull always
# PANGOLIN_ENDPOINT= NEWT_ID= NEWT_SECRET= docker compose --file docker-compose.yml --project-name openstudiolandscapes-hub up --pull always --remove-orphans --detach
#
# Log with
# docker compose --file docker-compose.yml --project-name openstudiolandscapes-hub log --follow
#
# Down with
# docker compose --file docker-compose.yml --project-name openstudiolandscapes-hub down

include:

  # - # Supported Linux OS: amd64, arm64, ppc64el
  #   project_directory: ./guacamole
  #   path:
  #     - ./guacamole/docker-compose.guacamole.yml

  - # Caddy
    project_directory: ./caddy
    path:
      - ./caddy/docker-compose.caddy.yml
    env_file:
      - ./__SECRET__.env/caddy.env

  - # Cloudflare DDNS
    project_directory: ./cloudflare-ddns
    path:
      - ./cloudflare-ddns/docker-compose.cloudflare-ddns.yml
    # env_file:
    #   - ./__SECRET__.env/caddy.env

  - # Pangolin
    project_directory: ./pangolin
    path:
      - ./pangolin/docker-compose.pangolin.yml
    env_file:
      - ./__SECRET__.env/pangolin.env

  # - # Pihole
  #   project_directory: ./pihole
  #   path:
  #     - ./pihole/docker-compose.pi-hole.yml

  # - # Portainer
  #   project_directory: ./portainer
  #   path:
  #     - ./portainer/docker-compose.portainer.yml

  # - # Registry
  #   project_directory: ./registry
  #   path:
  #     - ./registry/docker-compose.registry.yml

  # - # Registry
  #   project_directory: ./ntfy
  #   path:
  #     - ./registry/docker-compose.ntfy.yml


