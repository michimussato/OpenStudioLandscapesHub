http:
  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https

  routers:
    # HTTP to HTTPS redirect router
    main-app-router-redirect:
      rule: "Host(`pangolin.<YOUR_DOMAIN>`)" # REPLACE WITH YOUR DOMAIN
      service: next-service
      entryPoints:
        - web
      middlewares:
        - redirect-to-https

    # Next.js router (handles everything except API and WebSocket paths)
    next-router:
      rule: "Host(`pangolin.<YOUR_DOMAIN>`) && !PathPrefix(`/api/v1`)" # REPLACE WITH YOUR DOMAIN
      service: next-service
      entryPoints:
        - websecure
      tls:
#        certResolver: letsencrypt
        certResolver: cloudns_production
        domains:
          - main: "pangolin.<YOUR_DOMAIN>"
            sans:
              - "*.pangolin.<YOUR_DOMAIN>"

    # API router (handles /api/v1 paths)
    api-router:
      rule: "Host(`pangolin.<YOUR_DOMAIN>`) && PathPrefix(`/api/v1`)" # REPLACE WITH YOUR DOMAIN
      service: api-service
      entryPoints:
        - websecure
      tls:
        certResolver: cloudns_production

    # WebSocket router
    ws-router:
      rule: "Host(`pangolin.<YOUR_DOMAIN>`)" # REPLACE WITH YOUR DOMAIN
      service: api-service
      entryPoints:
        - websecure
      tls:
        certResolver: cloudns_production

  services:
    next-service:
      loadBalancer:
        servers:
          - url: "http://pangolin:3002" # Next.js server

    api-service:
      loadBalancer:
        servers:
          - url: "http://pangolin:3000" # API/WebSocket server
