# -- Configure your CertificateResolver here...
certificatesResolvers:
  cloudns_staging:
    acme:
      email: michimussato@gmail.com  # <-- Change this to your email
      storage: /letsencrypt/acme.cloudns_staging.json
      caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
      dnsChallenge:
        provider: cloudns  # <-- (Optional) Change this to your DNS provider
        resolvers:
          - "8.8.4.4:53"
          - "8.8.8.8:53"
  cloudns_production:
    acme:
      email: michimussato@gmail.com  # <-- Change this to your email
      storage: /letsencrypt/acme.cloudns_production.json
      caServer: "https://acme-v02.api.letsencrypt.org/directory"
      dnsChallenge:
        provider: cloudns  # <-- (Optional) Change this to your DNS provider
        resolvers:
          - "8.8.4.4:53"
          - "8.8.8.8:53"

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        readTimeout: "30m"
    http:
      tls:
        certResolver: "cloudns_production"

serversTransport:
  insecureSkipVerify: true

ping:
    entryPoint: "web"
