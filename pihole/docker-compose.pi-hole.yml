services:
  pihole-unbound:
    # https://docs.docker.com/reference/compose-file/services/#shm_size
    # docker exec -it pihole-unbound df /dev/shm
    # Note: docker compose restart won't reflect
    # changes in shm_size
    # requires down -> up
    shm_size: 1gb
    cap_add: []
    container_name: pihole-unbound
    environment:
      - FTLCONF_dns_dnssec=${FTLCONF_dns_dnssec}
      - FTLCONF_dns_listeningMode=${FTLCONF_dns_listeningMode}
      - FTLCONF_dns_upstreams=${FTLCONF_dns_upstreams}
      - FTLCONF_webserver_api_password=${FTLCONF_webserver_api_password}
      - FTLCONF_webserver_interface_theme=${FTLCONF_webserver_interface_theme}
      - FTLCONF_dns_revServers=${FTLCONF_dns_revServers}
      - FTLCONF_webserver_port=${FTLCONF_webserver_port}
      - TZ=${TZ}
    hostname: pihole-unbound
    image: docker.io/mpgirro/pihole-unbound:latest
#    labels:
#      # Todo
#      #  - [ ] automatically redirect to /admin
#      #        - pangolin.proxy-resources.pihole.targets[0].path=/admin maybe?
#      - pangolin.proxy-resources.pihole.name=Pihole
#      - pangolin.proxy-resources.pihole.full-domain=pihole.pangolin.openstudiolandscapes.cloud-ip.cc
#      - pangolin.proxy-resources.pihole.protocol=http
#      - pangolin.proxy-resources.pihole.auth.sso-enabled=true
#      - pangolin.proxy-resources.pihole.targets[0].method=http
#      - pangolin.proxy-resources.pihole.targets[0].hostname=pihole
#      - pangolin.proxy-resources.pihole.targets[0].port=80
    depends_on:
      newt:
        condition: service_started
    ports:
    - "53:53/tcp"
    - "53:53/udp"
    - "88:80/tcp"  # <-- Leave this one exposed so that we *could* reach this Web UI by <IP>:<PORT>
    restart: unless-stopped
    volumes:
    - ../.volumes/data/pi-hole/etc/pihole:/etc/pihole:rw
    - ../.volumes/data/pi-hole/etc/dnsmasq.d:/etc/dnsmasq.d:rw
    - ../.volumes/data/pi-hole/etc/unbound/unbound.conf.d:/etc/unbound/unbound.conf.d:rw
