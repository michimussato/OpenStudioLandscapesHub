services:
  registry:
    container_name: registry
    hostname: registry
    restart: always
    image: docker.io/registry:3
#    labels:
#      - pangolin.proxy-resources.registry.name=Registry
#      - pangolin.proxy-resources.registry.full-domain=registry.pangolin.openstudiolandscapes.cloud-ip.cc
#      - pangolin.proxy-resources.registry.protocol=http
#      - pangolin.proxy-resources.registry.auth.sso-enabled=true
#      - pangolin.proxy-resources.registry.targets[0].method=https
#      - pangolin.proxy-resources.registry.targets[0].hostname=registry
#      - pangolin.proxy-resources.registry.targets[0].port=5000
    depends_on:
      newt:
        condition: service_started
    volumes:
      - ../.volumes/data/registry/data:/var/lib/registry:rw
      - ../.volumes/data/registry/certs:/certs:ro
      - ../.volumes/data/registry/auth:/auth:ro
    environment:
      REGISTRY_HTTP_TLS_CERTIFICATE: ${REGISTRY_HTTP_TLS_CERTIFICATE}
      REGISTRY_HTTP_TLS_KEY: ${REGISTRY_HTTP_TLS_KEY}
      REGISTRY_AUTH: ${REGISTRY_AUTH}
      REGISTRY_AUTH_HTPASSWD_REALM: ${REGISTRY_AUTH_HTPASSWD_REALM}
      REGISTRY_AUTH_HTPASSWD_PATH: ${REGISTRY_AUTH_HTPASSWD_PATH}
      # https://github.com/Joxit/docker-registry-ui?tab=readme-ov-file#recommended-docker-registry-usage
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Origin: '[https://registry-ui.pangolin.<YOUR_DOMAIN>]'  # <-- CHANGE ME
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Methods: '[HEAD,GET,OPTIONS,DELETE]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Credentials: '[true]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Headers: '[Authorization,Accept,Cache-Control]'
      REGISTRY_HTTP_HEADERS_Access-Control-Expose-Headers: '[Docker-Content-Digest]'
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
    ports:
      - "5000:5000"

  registry-ui:
    image: joxit/docker-registry-ui:main
    restart: always
    depends_on:
      registry:
        condition: service_started
    environment:
      - SINGLE_REGISTRY=true
      - REGISTRY_TITLE=OpenStudioLandscapes Hub Registry
      - DELETE_IMAGES=true
      - SHOW_CONTENT_DIGEST=true
      - NGINX_PROXY_PASS_URL=https://registry:5000
      - SHOW_CATALOG_NB_TAGS=true
      - CATALOG_MIN_BRANCHES=1
      - CATALOG_MAX_BRANCHES=1
      - TAGLIST_PAGE_SIZE=100
      - REGISTRY_SECURED=false
      - CATALOG_ELEMENTS_LIMIT=1000
    container_name: registry-ui
