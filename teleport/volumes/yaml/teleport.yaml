  https_keypairs_reload_interval: 120s
  listen_addr: 0.0.0.0:3023
  public_addr:
  - teleport.openstudiolandscapes.cloud-ip.cc:443
  - teleport.openstudiolandscapes.lan:443
  tunnel_listen_addr: 0.0.0.0:3024
  web_listen_addr: 0.0.0.0:443
