  enabled: false
teleport:
  ca_pin: ''
  data_dir: /var/lib/teleport
  diag_addr: ''
  join_params:
    method: github
    token_name: ''
  log:
    format:
      output: text
    output: stderr
    severity: INFO
  nodename: teleport.openstudiolandscapes.cloud-ip.cc
version: v3
