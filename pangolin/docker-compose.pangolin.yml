services:
  pangolin:
    image: fosrl/pangolin:latest # https://github.com/fosrl/pangolin/releases
    container_name: pangolin
    restart: unless-stopped
    depends_on:
      pihole-unbound:
        condition: service_healthy
    volumes:
      # https://docs.pangolin.net/self-host/manual/docker-compose#file-structure
      - ../.volumes/config/pangolin/:/app/config/
      - ../.volumes/data/pangolin/certificates:/var/certificates
      - ../.volumes/data/pangolin/dynamic:/var/dynamic
    healthcheck:
      test: [
        "CMD",
        "curl",
        "-f",
        "http://localhost:3001/api/v1/"
      ]
      interval: "3s"
      timeout: "3s"
      retries: 15

  gerbil:
    image: fosrl/gerbil:latest # https://github.com/fosrl/gerbil/releases
    container_name: gerbil
    restart: unless-stopped
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    volumes:
      - ../.volumes/data/pangolin/gerbil/config/:/var/config
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - "51820:51820/udp"
      - "21820:21820/udp"
      - "443:443" # Port for traefik because of the network_mode
      - "80:80" # Port for traefik because of the network_mode
      # For Traefik Dashboard access, create a new Site of type "Local";
      # no need to expose the port here.
      # - https://github.com/orgs/fosrl/discussions/402
      # - https://github.com/fosrl/pangolin/issues/564
      - "8080:8080" # Port for traefik Dashboard because of the network_mode

  traefik:
    image: traefik:v3.4.0
    container_name: traefik
    env_file:
      - ../.env/pangolin.env
    restart: unless-stopped
    network_mode: service:gerbil # Ports appear on the gerbil service
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    volumes:
      - ../.volumes/config/pangolin/traefik/:/etc/traefik/ # Volume to store the Traefik configuration
      - ../.volumes/config/pangolin/letsencrypt:/letsencrypt # Volume to store the Let's Encrypt certificates
      # Shared volume for certificates and dynamic config in file mode
      - ../.volumes/data/pangolin/certificates:/var/certificates
      - ../.volumes/data/pangolin/dynamic:/var/dynamic

# If Pangolin is used in its own Docker Compose setup,
# uncomment this:
#networks:
#  default:
#    driver: bridge
#    name: pangolin
