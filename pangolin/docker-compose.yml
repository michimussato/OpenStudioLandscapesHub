services:
  pangolin:
    image: fosrl/pangolin:latest # https://github.com/fosrl/pangolin/releases
    container_name: pangolin
    restart: unless-stopped
    volumes:
      - ../.volumes/pangolin/__SECRET__config:/app/config
      # - ../.volumes/pangolin/data:/var/certificates
      # - ../.volumes/pangolin/data:/var/dynamic
    healthcheck:
      test: [
        "CMD",
        "curl",
        "-f",
        "http://localhost:3001/api/v1/"
      ]
      interval: "3s"
      timeout: "3s"
      retries: 15

  gerbil:
    image: fosrl/gerbil:latest # https://github.com/fosrl/gerbil/releases
    container_name: gerbil
    restart: unless-stopped
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    volumes:
      - ../.volumes/pangolin/__SECRET__config:/var/config
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - "51820:51820/udp"
      - "21820:21820/udp"
      - "443:443" # Port for traefik because of the network_mode
      - "80:80" # Port for traefik because of the network_mode
      # For Traefik Dashboard access, create a new Site of type "Local";
      # no need to expose the port here.
      # - https://github.com/orgs/fosrl/discussions/402
      # - https://github.com/fosrl/pangolin/issues/564
      # - "8080:8080" # Port for traefik Dashboard because of the network_mode

  traefik:
    image: traefik:v3.6
    container_name: traefik
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      - LEGO_DISABLE_CNAME_SUPPORT=${LEGO_DISABLE_CNAME_SUPPORT}
    env_file:
      - ../__SECRET__.env/pangolin.env
    restart: always
    network_mode: service:gerbil # Ports appear on the gerbil service
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    volumes:
      - ../.volumes/pangolin/__SECRET__config/traefik:/etc/traefik:rw # Volume to store the Traefik configuration
      - ../.volumes/pangolin/__SECRET__config/letsencrypt:/letsencrypt # Volume to store the Let's Encrypt certificates
      - ../.volumes/pangolin/__SECRET__config/traefik/logs:/var/log/traefik:rw
      # Shared volume for certificates and dynamic config in file mode
      # - ../.volumes/pangolin/data:/var/certificates
      # - ../.volumes/pangolin/data:/var/dynamic

networks:
  default:
    driver: bridge
    name: pangolin


