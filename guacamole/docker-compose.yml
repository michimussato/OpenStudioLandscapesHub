# Guacamole for ARM:
# https://hub.docker.com/search?q=Guacamole&architecture=arm%2Carm64
# https://hub.docker.com/r/flcontainers/guacamole
services:
  guacamole:
    image: flcontainers/guacamole
    container_name: guacamole
    restart: always
    depends_on:
      newt:
        condition: service_started
      # pihole-unbound:
      #   condition: service_healthy
#    networks:
#      - pangolin
    # env_file:
    #   - ../.env/guacamole.env
    volumes:
      - ../.volumes/guacamole/postgres:/config
      - ../.volumes/guacamole/recordings:/var/lib/guacamole/recordings
      - /etc/localtime:/etc/localtime:ro
#    ports:
#      - 8080:8080
